<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - NoirStreet</title>
    <style>
:root{
  --bg: #06070d;
  --bg2: #0f1220;
  --panel: rgba(255, 255, 255, 0.06);
  --panel-strong: rgba(255, 255, 255, 0.12);
  --text: #f7f8ff;
  --muted: #bbbfd6;
  --line: rgba(255, 255, 255, 0.16);
  --gold: #ffd27a;
  --violet: #8f7cff;
  --cyan: #66f1ff;
  --danger: #ff6f91;
  --shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
  --radius: 18px;
}

*{ box-sizing: border-box; }
html, body { height: 100%; }
body{
  margin: 0;
  color: var(--text);
  font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
  background:
    radial-gradient(1000px 500px at 8% -10%, rgba(143, 124, 255, 0.32), transparent 60%),
    radial-gradient(900px 600px at 95% 10%, rgba(102, 241, 255, 0.14), transparent 58%),
    linear-gradient(180deg, #070910 0%, #06070d 65%, #0a0d18 100%);
}

a{ color: inherit; text-decoration: none; }
button, input{ font: inherit; }

.topbar{
  position: sticky;
  top: 0;
  z-index: 20;
  border-bottom: 1px solid var(--line);
  background: rgba(8, 10, 20, 0.78);
  backdrop-filter: blur(14px);
}

.topbar__inner{
  max-width: 1180px;
  margin: 0 auto;
  padding: 12px 16px;
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}

.brand{
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.brand__mark{
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: inline-grid;
  place-content: center;
  font-weight: 800;
  color: #0b0b12;
  background: linear-gradient(135deg, var(--gold), #ff9a5f);
}
.brand__text{
  font-size: 1.1rem;
  font-weight: 700;
}

.authButton, .nav__link{
  padding: 9px 13px;
  color: var(--text);
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 10px;
}

.container{
  max-width: 1180px;
  margin: 0 auto;
  padding: 24px 16px 44px;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.fadeInUp{
  animation: fadeUp 0.5s ease both;
}

.checkoutLayout{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
.card{
  border: 1px solid var(--line);
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
  padding: 16px;
  box-shadow: var(--shadow);
}
.card__title{
  margin: 0 0 12px;
}
.checkoutItems{
  display: grid;
  gap: 10px;
}
.lineRow{
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  background: rgba(255, 255, 255, 0.03);
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.mutedText{ color: var(--muted); }
.form{ display: grid; gap: 12px; }
.field label{
  display: block;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 0.88rem;
}
.field input{
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255,255,255,0.04);
  color: var(--text);
  padding: 10px 12px;
}
.formRow2{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.primaryBtn{
  border: 0;
  border-radius: 12px;
  padding: 11px 16px;
  color: #111;
  font-weight: 800;
  cursor: pointer;
  background: linear-gradient(135deg, var(--gold), #ffaf68);
}
.form__error{
  min-height: 18px;
  color: var(--danger);
}
.successBox{
  margin-top: 12px;
  border: 1px solid #73e8cc77;
  border-radius: 12px;
  padding: 12px;
  background: rgba(45, 212, 191, 0.12);
}
.toast{
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  border: 1px solid var(--line);
  background: #101325;
  border-radius: 12px;
  padding: 10px 14px;
  box-shadow: var(--shadow);
  opacity: 0;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.toast.is-show{
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
[hidden]{ display: none !important; }

@media (max-width: 760px){
  .checkoutLayout{
    grid-template-columns: 1fr;
  }
  .formRow2{
    grid-template-columns: 1fr;
  }
}
    </style>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="/"><span class="brand__mark">N</span><span class="brand__text">NoirStreet</span></a>
        <div class="topbar__actions">
          <a class="nav__link" href="/">Continue Shopping</a>
          <button class="authButton" id="authButton" type="button">Sign in</button>
        </div>
      </div>
    </header>
    <main class="container checkoutLayout fadeInUp">
      <section class="card">
        <h2 class="card__title">Order Summary</h2>
        <div id="checkoutItems" class="checkoutItems"></div>
        <div class="lineRow"><span>Subtotal</span><strong id="checkoutSubtotal">₹0</strong></div>
        <div class="mutedText" id="checkoutEmpty" hidden>Your cart is empty.</div>
      </section>
      <section class="card">
        <h2 class="card__title">Shipping Details</h2>
        <form id="checkoutForm" class="form">
          <div class="field"><label for="shipFullName">Full Name</label><input id="shipFullName" name="fullName" type="text" required /></div>
          <div class="field"><label for="shipAddress1">Address line 1</label><input id="shipAddress1" name="addressLine1" type="text" required /></div>
          <div class="field"><label for="shipAddress2">Address line 2 (optional)</label><input id="shipAddress2" name="addressLine2" type="text" /></div>
          <div class="formRow2">
            <div class="field"><label for="shipCity">City</label><input id="shipCity" name="city" type="text" required /></div>
            <div class="field"><label for="shipState">State</label><input id="shipState" name="state" type="text" required /></div>
          </div>
          <div class="formRow2">
            <div class="field"><label for="shipZip">ZIP</label><input id="shipZip" name="zip" type="text" required /></div>
            <div class="field"><label for="shipCountry">Country</label><input id="shipCountry" name="country" type="text" value="India" /></div>
          </div>
          <button class="primaryBtn" type="submit">Place Order</button>
          <div class="form__error" id="checkoutError" role="alert"></div>
        </form>
        <div id="checkoutSuccess" class="successBox" hidden>
          <h3>Order placed!</h3>
          <div id="checkoutSuccessText" class="mutedText"></div>
        </div>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="/api.js"></script>
    <script src="/auth-ui.js"></script>
    <script src="/checkout.js"></script>
  </body>
</html>
