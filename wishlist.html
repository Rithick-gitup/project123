<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist - NoirStreet</title>
    <style>
:root{
  --bg: #06070d;
  --panel: rgba(255, 255, 255, 0.06);
  --text: #f7f8ff;
  --muted: #bbbfd6;
  --line: rgba(255, 255, 255, 0.16);
  --gold: #ffd27a;
  --shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
  --radius: 18px;
}

*{ box-sizing: border-box; }
body{
  margin: 0;
  color: var(--text);
  font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
  background:
    radial-gradient(1000px 500px at 8% -10%, rgba(143, 124, 255, 0.32), transparent 60%),
    radial-gradient(900px 600px at 95% 10%, rgba(102, 241, 255, 0.14), transparent 58%),
    linear-gradient(180deg, #070910 0%, #06070d 65%, #0a0d18 100%);
}

a{ color: inherit; text-decoration: none; }
button{ font: inherit; }

.topbar{
  position: sticky;
  top: 0;
  z-index: 20;
  border-bottom: 1px solid var(--line);
  background: rgba(8, 10, 20, 0.78);
  backdrop-filter: blur(14px);
}
.topbar__inner{
  max-width: 1180px;
  margin: 0 auto;
  padding: 12px 16px;
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}
.brand{
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.brand__mark{
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: inline-grid;
  place-content: center;
  font-weight: 800;
  color: #0b0b12;
  background: linear-gradient(135deg, var(--gold), #ff9a5f);
}
.brand__text{
  font-size: 1.1rem;
  font-weight: 700;
}
.authButton, .cartButton{
  border-radius: 10px;
  padding: 9px 13px;
  border: 1px solid var(--line);
}
.authButton{
  color: var(--text);
  background: var(--panel);
}
.cartButton{
  background: linear-gradient(135deg, var(--gold), #f8b85f);
  color: #111;
  font-weight: 700;
}
.cartButton__badge{
  display: inline-grid;
  place-content: center;
  margin-left: 8px;
  min-width: 20px;
  min-height: 20px;
  border-radius: 999px;
  background: #111;
  color: #fff;
  font-size: 0.75rem;
}
.container{
  max-width: 1180px;
  margin: 0 auto;
  padding: 24px 16px 44px;
}
.sectionHead h2{
  margin: 0;
  font-size: clamp(1.5rem, 4vw, 2rem);
  font-family: "Georgia", "Times New Roman", serif;
}
.sectionHead p{
  margin: 8px 0 0;
  color: var(--muted);
}
.productGrid{
  margin-top: 22px;
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
}
.productCard{
  position: relative;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
  box-shadow: var(--shadow);
}
.productCard img{
  width: 100%;
  height: 220px;
  object-fit: cover;
}
.productCard h3{
  margin: 14px 14px 6px;
  font-size: 1.04rem;
}
.productCard p{
  margin: 0 14px 14px;
  color: #daddf4;
  font-weight: 700;
}
.productCard button{
  margin: 0 14px 14px;
  width: calc(100% - 28px);
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #141727;
  color: var(--text);
  padding: 10px;
  cursor: pointer;
  font-weight: 700;
}
.emptyState{
  margin-top: 18px;
  border: 1px dashed var(--line);
  border-radius: 12px;
  padding: 14px;
  color: var(--muted);
}
.drawer{
  position: fixed;
  inset: 0;
  z-index: 80;
  pointer-events: none;
  visibility: hidden;
}
.drawer.is-open{
  pointer-events: auto;
  visibility: visible;
}
.drawer__overlay{
  position: absolute;
  inset: 0;
  background: rgba(2, 3, 8, 0.65);
  opacity: 0;
  transition: opacity 0.2s ease;
}
.drawer.is-open .drawer__overlay{ opacity: 1; }
.drawer__panel{
  position: absolute;
  top: 0;
  right: 0;
  width: min(420px, 92%);
  height: 100%;
  background: #101325;
  border-left: 1px solid var(--line);
  transform: translateX(100%);
  transition: transform 0.32s cubic-bezier(0.2, 0.9, 0.2, 1);
  display: flex;
  flex-direction: column;
}
.drawer.is-open .drawer__panel{ transform: translateX(0); }
.drawer__header{
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px;
  border-bottom: 1px solid var(--line);
}
#cartItems{
  padding: 12px;
  display: grid;
  gap: 10px;
  overflow: auto;
  flex: 1;
}
.lineRow{
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  background: rgba(255, 255, 255, 0.03);
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.drawer__footer{
  border-top: 1px solid var(--line);
  padding: 12px;
  display: grid;
  gap: 10px;
}
#goToCheckoutBtn{
  border: 0;
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
  font-weight: 800;
  background: linear-gradient(135deg, var(--gold), #ffaf68);
}
.toast{
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  border: 1px solid var(--line);
  background: #101325;
  border-radius: 12px;
  padding: 10px 14px;
  box-shadow: var(--shadow);
  opacity: 0;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.toast.is-show{
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
[hidden]{ display: none !important; }
    </style>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="/"><span class="brand__mark">N</span><span class="brand__text">NoirStreet</span></a>
        <div class="topbar__actions">
          <a class="authButton" href="/">Back to Shop</a>
          <button class="cartButton" id="openCartBtn" type="button">My Bag <span class="cartButton__badge" id="cartCountBadge">0</span></button>
        </div>
      </div>
    </header>
    <main class="container">
      <section class="sectionHead">
        <h2>Your Wishlist</h2>
        <p>Save today, shop anytime.</p>
      </section>
      <div class="productGrid" id="wishlistGrid"></div>
      <div class="emptyState" id="wishlistEmpty" hidden>No items in wishlist yet.</div>
    </main>
    <aside class="drawer" id="cartDrawer">
      <div class="drawer__overlay" id="cartOverlay"></div>
      <div class="drawer__panel">
        <div class="drawer__header"><h2>Your Bag</h2><button id="closeCartBtn">✕</button></div>
        <div id="cartItems"></div>
        <div class="drawer__footer"><strong id="cartTotalStrong">₹0</strong><button id="goToCheckoutBtn">Secure Checkout</button></div>
      </div>
    </aside>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="/api.js"></script>
    <script src="/cart-ui.js"></script>
    <script src="/wishlist.js"></script>
  </body>
</html>
